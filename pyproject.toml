[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icstex"
version = "2.1.0-beta.1"
description = "ICC Student's TeX: a cross-platform Overleaf-style desktop LaTeX editor and live compiler."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "watchdog>=4.0",
    "pylatexenc>=2.10,<3.0",
]

[project.optional-dependencies]
packaging = ["pyinstaller>=6.0"]
agent = ["mcp>=2.0,<3"]

[project.scripts]
icstex = "app.__main__:main"
icstex-mcp = "app.mcp_server:main"

[tool.setuptools.packages.find]
include = ["app*"]
